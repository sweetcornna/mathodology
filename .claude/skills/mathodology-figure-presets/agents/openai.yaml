interface:
  display_name: "Mathodology Scientific Figures"
  short_description: "Plotting guidance, 46 data-driven code templates and experiment kits"
  default_prompt: "Use $mathodology-figure-presets and read references/figure-guidance.md to select a purposeful scientific figure and adapt its plotting and caption prompts. Ask once per modeling task about image2 availability unless already answered. Without image2 or while awaiting an answer, use the 46 callable chart code templates with real data and execute them to generate PNG/PDF; compute experiment figures with the experiment kits. Keep quantitative marks data-driven, use licensed references selectively, and inspect the final render."
