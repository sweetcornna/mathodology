interface:
  display_name: "Mathodology Evidence Search"
  short_description: "Dual-source evidence acquisition and citation verification"
  default_prompt: "Use $mathodology-evidence-search whenever a Mathodology award run needs external evidence: literature, datasets, benchmark methods, domain constants, prior-art checks, or citation verification. It directs agents to combine built-in WebSearch with the search MCP tool stack by default, reconcile and deduplicate sources, use category routing to arXiv/OpenAlex/Crossref/PubMed/Zenodo, verify citation metadata, preserve reproducible staged downloads, and record any single-source degradation explicitly in the handoff."
