interface:
  display_name: "Mathodology Evidence Search"
  short_description: "Web evidence acquisition and citation verification via the search MCP"
  default_prompt: "Use $mathodology-evidence-search whenever a Mathodology award run needs external evidence: literature, datasets, benchmark methods, domain constants, prior-art checks, or citation verification. It defines the search MCP tool stack (search/research/fetch/read_doc/compare/extract_structured/cache_search), category routing to arXiv/OpenAlex/Crossref/PubMed/Zenodo, the per-item search protocol, the citation verification protocol, the reproducibility boundary for downloaded data, token discipline, and the WebSearch/WebFetch fallback with an explicit search_backend handoff key."
