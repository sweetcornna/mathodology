interface:
  display_name: "Mathodology Evidence Search"
  short_description: "Dual-source evidence acquisition and citation verification"
  default_prompt: "Use $mathodology-evidence-search whenever a Mathodology award run needs external evidence: literature, datasets, benchmark methods, domain constants, prior-art checks, or citation verification. It directs agents to combine built-in WebSearch with the search MCP tool stack by default, reconcile and deduplicate sources, use two-level category routing across paper/dataset/news/finance/github/forum/image groups (arXiv, OpenAlex, Crossref, Semantic Scholar, PubMed, DBLP, zbMATH Open, Zenodo, and more), verify citation metadata, run the paper_graph retraction check, preserve reproducible staged downloads, and record any single-source degradation explicitly in the handoff."
